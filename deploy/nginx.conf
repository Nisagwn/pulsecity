# PulseCity — Nginx reverse proxy (Faz 6, Faz 9'da güncellendi)
#
# Tek public port (80) üzerinden iki arayüz açılır:
#   /         -> Faz 9 canlı harita (webviz) — demo linkinin ana sayfası
#   /grafana/ -> Faz 4 Grafana dashboard'u (anonim viewer)
#
# Prometheus, Kafka ve ScyllaDB bilerek dışarı açılmıyor; sadece Docker
# internal network üzerinden erişilebiliyorlar.

server {
    listen 80;
    server_name _;

    # --- Faz 9: canlı harita (kök adres) ---
    location / {
        proxy_pass http://webviz:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Faz 9: harita WebSocket akışı ---
    # Upgrade başlıkları olmadan WebSocket el sıkışması başarısız olur ve
    # harita sürekli yeniden bağlanmaya çalışır.
    location /ws {
        proxy_pass http://webviz:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Snapshot'lar saniyede bir aktığı için varsayılan 60sn timeout yeterli,
        # yine de sessiz dönemlerde bağlantı düşmesin diye uzatıldı.
        proxy_read_timeout 3600s;
    }

    # --- Faz 4: Grafana (alt yol) ---
    # Grafana tarafında GF_SERVER_SERVE_FROM_SUB_PATH=true ve
    # GF_SERVER_ROOT_URL=.../grafana/ ayarlı olmalı (bkz. docker-compose.prod.yml).
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana live/websocket bağlantıları için
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
