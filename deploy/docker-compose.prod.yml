# PulseCity — Production Compose Override (Faz 6)
#
# Kullanım (VPS üzerinde, proje kök dizininden):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Bu dosya, local docker-compose.yml'in ÜZERİNE gelen bir override'dır:
# - Kaynak limitleri ekler (paylaşımlı/ucuz VPS'te sistemin boğulmasını önlemek için)
# - restart policy ekler (VPS reboot sonrası otomatik ayağa kalkma)
# - Grafana/Prometheus portlarını sadece Caddy üzerinden dışa açacak şekilde kısıtlar
#   (doğrudan internete açık bırakmak yerine reverse proxy arkasına alır)
# - Ortam değişkenlerini .env dosyasından okur (bkz. .env.example)
#
# --- BELLEK BÜTÇESİ (Faz 18'de yeniden hesaplandı) ---
#
# Faz 6'da bu profil t3.large (8GB) için boyutlandırılmıştı. Sonraki fazlarda
# servis eklendi ama bütçe kimse tarafından yeniden hesaplanmadı:
#   Faz 13 -> alertmanager + kafka-exporter
#   Faz 17 -> loki + promtail
# Toplam limit 8.38 GB'a çıkmıştı, yani hedef instance'ın TAMAMINDAN fazla —
# işletim sistemine hiç pay kalmıyordu. Bu, kimsenin fark etmediği türden
# sessiz bir bozulma: local'de kimse prod profilini çalıştırmadığı için
# görünmüyordu.
#
#   kafka 1280M · scylla 3072M · producer 512M · consumer 2×512M
#   prometheus 512M · grafana 512M · alertmanager 128M · kafka-exporter 128M
#   loki 512M · promtail 128M · webviz 512M · caddy 128M
#   ------------------------------------------------------------------
#   TOPLAM 8.25 GB   (m7i-flex.large · işletim sistemine görünen RAM 7.6GB)
#
# --- TOPLAM NEDEN FİZİKSEL RAM'DEN BÜYÜK (ve neden sorun değil) ---
#
# Faz 18'in bütçesi 7.25 GB idi ve ScyllaDB'ye 2G veriyordu. GERÇEK SUNUCUDA
# ÖLÇTÜK: o değerle ScyllaDB hiç başlamıyor (gerekçe scylla servisinin
# üstündeki not). Çalışan en küçük değer 3G çıktı, bu da toplamı 8.25 GB'a
# taşıdı.
#
# `deploy.resources.limits` bir REZERVASYON değil, TAVAN'dır: Docker o belleği
# ayırmaz, yalnızca konteynerin aşmasını engeller. Tavanların toplamının
# fiziksel RAM'i aşması, hepsinin AYNI ANDA tavana dayanması hâlinde risk
# yaratır - bu iş yükünde gerçekleşmeyen bir senaryo (ScyllaDB'nin kendisi
# `--memory 1500M` ile sınırlı, yani 3G tavanına hiç yaklaşmaz; tavan
# seastar'ın pay hesabını doğru yapabilmesi için var).
#
# ÖLÇÜM, hesap değil - `docker stats` ile gerçek kullanım (m7i-flex.large,
# 50.000 msg/sn yükü altında, 2026-08-29):
#
#   scylla 1.40G/3G · kafka 989M/1.25G · loki 109M/512M · grafana 81M/512M
#   producer 56M/512M · prometheus 35M/512M · alertmanager 36M/128M
#   promtail 26M/128M · consumer 15M+14M/512M · webviz 15M/512M
#   caddy 12M/128M · kafka-exporter 7M/128M
#   ------------------------------------------------------------------
#   HOST TOPLAM 2.8 GB / 7.6 GB  -> tavanların toplamı 8.25 GB olsa da
#   gerçek kullanım bunun ÜÇTE BİRİ. Tavan-toplamı endişesi pratikte yok.
#
# Limitine en çok yaklaşan Kafka (%77). Küçültülecek ilk yer orası DEĞİL;
# gevşetilecek yer orası. Grafana/Prometheus/Loki limitlerinin %20'sinin
# altında - istenirse oradan 1 GB'a yakın yer açılabilir.
#
# CPU ise DOLU: aynı ölçümde scylla %63, kafka %52, webviz %40, producer %20,
# consumer'lar %17 - toplam ~%191 / %200 (2 vCPU). Darboğaz bellek değil CPU,
# ve asıl sınırlayıcı ScyllaDB'nin yazma hızı.
#
# Sıkışıklık görülürse ilk kısılacak yer Grafana, Prometheus ve Loki: üçü de
# demo yükünde limitlerinin çok altında çalışır.
#
# 3 consumer replikası ya da Faz 3 benchmark'ı koşulacaksa 4 vCPU / 16 GB
# gerekir (m7i-flex.xlarge).

services:
  kafka:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M

  scylla:
    restart: unless-stopped
    # --reserve-memory ZORUNLU, opsiyonel bir ayar değil.
    #
    # Seastar (ScyllaDB'nin altyapısı) kullanılabilir belleği şöyle hesaplar:
    #
    #     görünen = konteyner limiti − pay − ~166 MiB sabit gider
    #
    # ve pay verilmezse varsayılanı `max(1.5 GiB, %7)`'dir. Yani limiti
    # büyütmek TEK BAŞINA işe yaramaz: pay da limitle birlikte büyür. 2G
    # limitte görünen 500 MB'a, 3G limitte 1436 MB'a düşüyordu; ScyllaDB'nin
    # `--memory 1500M` için ihtiyacı ise 1400 MiB. İkisinde de 30 MiB farkla
    # başlamıyordu.
    #
    # BU GERÇEK SUNUCUDA ÖLÇÜLDÜ, hesaplanmadı. Faz 18'de bütçe 2.5G/2000M'den
    # 2G/1500M'e indirilirken not düşülmüştü: "Bunun bir HESAP olduğu, ölçüm
    # olmadığı ayrıca not edildi — gerçek sunucuda doğrulanmalı." İlk gerçek
    # sunucuda tam da burada düştü.
    #
    # Neden payı 1G'de bırakıp limiti büyüttük, payı kısmak yerine: bu
    # konteynerin içinde ScyllaDB'den başka şeyler de çalışıyor — JMX sunucusu
    # (bir JVM), node_exporter, supervisord ve healthcheck'in her 10 saniyede
    # başlattığı cqlsh (Python). Hepsi bu paydan besleniyor. Payı 384M'ye
    # kısmak ScyllaDB'yi başlatırdı ama konteyneri OOM-kill'e açık bırakırdı.
    #
    # ARIZA BİÇİMİ SİNSİ: başlatma başarısız olduğunda supervisord üç denemeden
    # sonra "gave up" diyor ama KONTEYNER AYAKTA KALIYOR. Docker'ın
    # `restart: unless-stopped` politikası tetiklenmiyor, `docker compose ps`
    # servisi "Up (unhealthy)" gösteriyor ve ona `service_healthy` ile bağlı
    # olan consumer/prometheus/grafana/caddy sessizce hiç başlamıyor.
    command: >-
      --smp 2 --memory 1500M --reserve-memory 1G
      --overprovisioned 1 --api-address 0.0.0.0
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G

  producer:
    restart: unless-stopped
    ports: []   # local'de disariya acilan 2112 portu, prod'da kapali - Prometheus internal network'ten erisir
    environment:
      # VARSAYILAN 50.000 DEĞİL, 5.000.
      #
      # Önceki değer sessiz bir tuzaktı: 50k rakamı Faz 3'te 12 çekirdek /
      # 7,6 GB ile ölçülmüştü, ama bu profilin hedefi t3.large (2 vCPU) ve
      # producer'a burada 0.5 CPU limiti konuyor. `.env` içinde bu satır
      # doldurulmadığı her kurulumda consumer kalıcı olarak geride kalır;
      # lag Kafka'nın retention.bytes tavanına dayandığında segmentler
      # OKUNMADAN silinir — yani projenin ana iddiası olan zero-loss tam da
      # canlıda çürür. Hiçbir hata da görünmez: her şey "ayakta" kalır.
      #
      # Artık güvenli değer varsayılan, tehlikeli olan açık bir tercih.
      # 50k için 4 vCPU / 16 GB'a çıkıp buradaki CPU limitlerini de büyüt.
      TARGET_RATE_PER_SEC: "${TARGET_RATE_PER_SEC:-5000}"
      VEHICLE_COUNT: "${VEHICLE_COUNT:-2000}"
      PRODUCER_WORKERS: "${PRODUCER_WORKERS:-4}"
      # Faz 8 demo modu prod'da KAPALI: yapay tikaniklik bolgesel hiz
      # metriklerini ve benchmark sonuclarini kirletir.
      TEST_ANOMALY_DEMO: "false"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  consumer:
    restart: unless-stopped
    deploy:
      # Faz 3'ten Faz 18'e kadar 3 replikaydı; bellek bütçesi yeniden
      # hesaplanınca 2'ye indirildi (yukarıdaki tabloya bkz.). Yatay ölçekleme
      # ve zone-başına-tek-replika hikâyesi 2 replikayla da kanıtlanıyor.
      # 3 replika ya da Faz 3 benchmark'ı için t3.xlarge gerekir.
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prometheus:
    restart: unless-stopped
    ports: []   # doğrudan dışa kapalı; arayüzüne SSH tüneli ile bakılır
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Faz 13: alarm zinciri prod'da da ayakta olmalı — alarm üretmeyen bir
  # production kurulumu, gözlemlenebilirlik değil sadece grafik demektir.
  alertmanager:
    restart: unless-stopped
    ports: []   # dışa kapalı; arayüzüne SSH tüneli ile bakılır
    volumes:
      # Prod'da Slack alıcısı olan yapılandırma kullanılır. Webhook URL'si bu
      # dosyada DEĞİL — `slack_api_url_file` ile aşağıdaki dizinden okunuyor.
      - ./monitoring/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
      # SOPS ile çözülmüş sırlar. Bu dizin .gitignore'da ve deploy sırasında
      # cloud-init tarafından üretiliyor (age anahtarı SSM'den okunur;
      # bkz. infra/terraform/cloud-init.yaml).
      - ./secrets/decrypted:/etc/alertmanager/secrets:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  kafka-exporter:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Faz 17: log toplama.
  loki:
    restart: unless-stopped
    ports: []   # disa kapali; erisim Grafana uzerinden
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  promtail:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  webviz:
    restart: unless-stopped
    ports: []   # doğrudan dışa kapalı, Caddy üzerinden "/" olarak servis edilir
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    restart: unless-stopped
    ports: []   # doğrudan dışa kapalı, Caddy (deploy/Caddyfile) üzerinden /grafana/ olarak erişilir
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Faz 9'dan sonra kök adres haritaya ayrıldı, Grafana alt yola taşındı.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # --- Sertleştirme ---
      #
      # Anonim GÖRÜNTÜLEME bilerek açık kalıyor: demo linki paylaşılabilsin
      # diye. Sertleştirilen şey görüntüleme değil, HESAP yüzeyi — yani
      # birinin admin olarak İÇERİ girme ihtimali.
      #
      # Kaba kuvvet koruması Grafana'nın kendi işi (aynı kullanıcı için 5
      # başarısız denemeden sonra kilit). Burada açıkça "false" yazılması bir
      # tekrar değil, bir SÖZLEŞME: varsayılana güvenip sessiz kalmak, ileride
      # bir sürüm varsayılanı değiştirdiğinde kimsenin fark etmeyeceği bir
      # gerileme bırakırdı.
      #
      # Reverse proxy katmanında hız sınırı YOK ve bu bilinçli: stok Caddy
      # rate_limit modülüyle gelmez, eklemek xcaddy ile özel imaj derlemeyi
      # gerektirir. Tedarik zinciri (digest sabitleme + Trivy taraması) o
      # noktada elle bakım gerektiren bir yola girer; kazanç, Grafana'nın kendi
      # kilit mekanizması zaten devredeyken buna değmiyor.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      # Alan adı verilmişse (yani TLS varsa) oturum çerezi yalnızca HTTPS
      # üzerinden gitsin. TLS'siz kurulumda "true" yapmak girişi tamamen
      # kırardı — bu yüzden cloud-init domain'e göre yazıyor.
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-false}"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      # Dışarıya giden istekleri kes: gravatar kullanıcı e-postasının hash'ini
      # üçüncü bir tarafa sızdırır, telemetri ve sürüm kontrolü ise sunucudan
      # habersiz dış bağlantı açar.
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Faz 16: Nginx'in yerini Caddy aldı — otomatik TLS için.
  # Nginx yapılandırması deploy/nginx.conf'ta duruyor (TLS'siz kurulum ya da
  # Caddy'nin uygun olmadığı bir ortam için referans).
  caddy:
    image: caddy:2.8-alpine
    container_name: pulsecity-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 doğrulaması + HTTPS'e yönlendirme
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # `:-` compose'da hem TANIMSIZ hem de BOŞ değeri yakalar. Bu ayrım
      # kritik: Caddy'nin kendi `{$VAR:default}` sözdizimi yalnızca TANIMSIZ
      # değişkende varsayılanı kullanır, tanımlı-ama-boş olanda boş değeri
      # alır. .env dosyasında `PULSECITY_DOMAIN=` satırı (domain'siz kurulum)
      # tam olarak bu duruma düşüyordu ve Caddy hiç başlamıyordu:
      #   "server block without any key is global configuration..."
      # Boş bir site adresi Caddyfile'da global options bloğu gibi okunuyor.
      PULSECITY_DOMAIN: "${PULSECITY_DOMAIN:-:80}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.invalid}"
      # Test ederken staging'e almak için (bkz. Caddyfile):
      # ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory
      ACME_CA: "${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # SERTİFİKA KALICILIĞI — atlanırsa Let's Encrypt limitine takılırsın.
      # Caddy sertifikayı ve ACME hesap anahtarını /data altında tutar. Bu
      # volume olmadan her `docker compose up --build` sertifikayı SIFIRDAN
      # ister; "aynı sertifika" için haftada 5 istek sınırı vardır ve birkaç
      # deploy sonrası hafta boyu kilitlenirsin.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
      - webviz
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  caddy-data:
  caddy-config:
