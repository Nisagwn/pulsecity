name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.22"

jobs:
  # --- 1) Lint + derleme --------------------------------------------------
  lint-build:
    name: Lint & derleme (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [producer, consumer, webviz]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt kontrolü
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Bu dosyalar gofmt'lenmemiş:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Derleme
        run: go build ./...

  # --- 2) Unit testler ----------------------------------------------------
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [producer, consumer, webviz]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # -race yarış koşullarını yakalar: producer 8 goroutine ile paralel
      # üretiyor, consumer zone başına paralel yazıyor, webviz eşzamanlı
      # istemcilere yayın yapıyor - üçü de yarışa açık kod.
      - name: go test -race
        run: go test ./... -race -cover

  # --- 3) Uçtan uca boru hattı testi --------------------------------------
  integration:
    name: Uçtan uca boru hattı
    runs-on: ubuntu-latest
    needs: [lint-build, test]
    steps:
      - uses: actions/checkout@v4

      - name: Stack'i düşük yükle ayağa kaldır
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.ci.yml up -d --build

      - name: Prometheus hazır olana kadar bekle
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9090/-/ready >/dev/null 2>&1; then
              echo "Prometheus hazır (${i}. deneme)"
              exit 0
            fi
            sleep 5
          done
          echo "Prometheus 5 dakikada hazır olmadı"
          exit 1

      - name: Boru hattının veri işlediğini doğrula
        run: |
          # Metriklerin birikmesi için bir tur bekle
          sleep 45

          q() {
            curl -s "http://localhost:9090/api/v1/query?query=$1" \
              | jq -r '.data.result[0].value[1] // "0"'
          }

          produced=$(q pulsecity_producer_messages_total)
          processed=$(q pulsecity_consumer_messages_processed_total)
          dlq=$(q pulsecity_consumer_dlq_total)
          errors=$(q pulsecity_producer_errors_total)

          echo "Üretilen : $produced"
          echo "İşlenen  : $processed"
          echo "DLQ      : $dlq"
          echo "Hata     : $errors"

          [ "${produced%.*}" -gt 0 ]  || { echo "HATA: producer hiç mesaj üretmedi"; exit 1; }
          [ "${processed%.*}" -gt 0 ] || { echo "HATA: consumer hiç mesaj işlemedi"; exit 1; }
          [ "${dlq%.*}" -eq 0 ]       || { echo "HATA: DLQ'ya mesaj düştü ($dlq)"; exit 1; }
          [ "${errors%.*}" -eq 0 ]    || { echo "HATA: producer yazma hatası aldı ($errors)"; exit 1; }

      - name: ScyllaDB'ye gerçekten yazıldığını doğrula
        run: |
          rows=$(docker exec pulsecity-scylla cqlsh --request-timeout=120 \
            -e "SELECT COUNT(*) FROM pulsecity.vehicle_pings;" \
            | grep -Eo '^\s+[0-9]+\s*$' | tr -d ' ')
          echo "ScyllaDB satır sayısı: ${rows:-0}"
          [ "${rows:-0}" -gt 0 ] || { echo "HATA: ScyllaDB'ye hiç satır yazılmadı"; exit 1; }

      - name: Faz 8 anomali metriklerinin yayınlandığını doğrula
        run: |
          zones=$(curl -s http://localhost:9090/api/v1/label/zone_id/values | jq '.data | length')
          echo "Bölge sayısı: $zones"
          [ "$zones" -eq 9 ] || { echo "HATA: 9 bölge bekleniyordu, $zones geldi"; exit 1; }

          series=$(curl -s "http://localhost:9090/api/v1/query?query=pulsecity_zone_speed_baseline_kmh" \
            | jq '.data.result | length')
          echo "Baseline serisi: $series"
          [ "$series" -gt 0 ] || { echo "HATA: Faz 8 baseline metriği üretilmedi"; exit 1; }

      - name: Faz 9 haritasının yanıt verdiğini doğrula
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          [ "$code" = "200" ] || { echo "HATA: harita sayfası HTTP $code döndü"; exit 1; }

          consumed=$(curl -s http://localhost:8080/metrics \
            | awk '/^pulsecity_webviz_messages_consumed_total/ {print $2}')
          echo "webviz tükettiği mesaj: ${consumed:-0}"
          [ "${consumed%.*}" -gt 0 ] || { echo "HATA: webviz Kafka'dan mesaj okumadı"; exit 1; }

      - name: Hata durumunda logları göster
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.ci.yml logs --tail 120

      - name: Temizlik
        if: always()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.ci.yml down -v

  # --- 4) İmajları GHCR'a gönder ------------------------------------------
  docker-push:
    name: İmaj yayınla (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [producer, consumer, webviz]
    steps:
      - uses: actions/checkout@v4

      # GHCR imaj adları küçük harf olmak zorunda; depo sahibi adı büyük harf
      # içerebildiği için dönüştürülüyor.
      - name: Depo sahibini küçük harfe çevir
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Ek secret gerekmiyor: GITHUB_TOKEN paket yazma yetkisiyle geliyor.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmaj etiketlerini hazırla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/pulsecity-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- 5) VPS'e dağıtım (henüz pasif) -------------------------------------
  #
  # Canlıya alma bilinçli olarak sonraya bırakıldı. Bu job iki koşul birden
  # saglanmadan ÇALIŞMAZ:
  #   1. Workflow elle tetiklenmiş olmalı (Actions -> Run workflow)
  #   2. Depoda DEPLOY_ENABLED adlı repository variable "true" olmalı
  #      (Settings -> Secrets and variables -> Actions -> Variables)
  #
  # Ayrıca şu secret'lar tanımlanmalı:
  #   VPS_HOST     - sunucunun IP adresi veya alan adı
  #   VPS_USER     - SSH kullanıcısı (docker grubunda olmalı)
  #   VPS_SSH_KEY  - private key (passphrase'siz)
  #
  # Detaylı sunucu hazırlığı için: deploy/DEPLOY.md
  deploy:
    name: VPS'e dağıt (manuel)
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Sunucuda güncelle ve yeniden başlat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/pulsecity
            git pull --ff-only
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
            docker compose ps
