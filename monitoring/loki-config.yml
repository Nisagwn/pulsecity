# PulseCity — Loki yapilandirmasi (Faz 17)
#
# Tek node, dosya sistemi depolama. Bu olcekte (tek VPS, tek operator) bir
# nesne deposu (S3) ya da coklu replika gerekmiyor; Loki'nin dagitik modu
# cozdugu problem burada yok.
#
# Prometheus'un log dunyasindaki karsiligi: Loki log ICERIGINI indekslemez,
# yalnizca ETIKETLERI indeksler. Bu yuzden etiket kardinalitesi kritiktir -
# bkz. promtail-config.yml'daki etiket secimi gerekcesi.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki'nin kendi loglari INFO'da oldukca gurultulu; sistemin kendi
  # gozlemlenebilirligi, gozlemledigi seyden fazla log uretmemeli.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # SAKLAMA SURESI — Faz 13'te Kafka ve ScyllaDB icin ogrenilen dersin aynisi:
  # kalici disk eklenen her bilesen, politika yazilmazsa sinirsiz buyur.
  retention_period: 168h # 7 gun

  # Cok eski girisleri reddet: bir konteyner saatlerce kapali kalip sonra tum
  # gecmisini birden gonderirse indeks bozulur.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Tek bir kaynagin diger her seyi bogmasini engelleyen hiz siniri.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

# retention_period'in gercekten UYGULANMASI icin compactor'da acikca
# etkinlestirilmesi gerekir. Yalnizca limits_config'e yazmak yetmez - bu,
# "politika yazdim ama isletilmiyordu" sinifindan sessiz bir hatadir.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m

# Kullanim analitigi kapali: kapali bir demo ortamindan disari veri gitmesin.
analytics:
  reporting_enabled: false
