#cloud-config
# PulseCity sunucu hazirligi.
#
# Bu dosya deploy/DEPLOY.md'nin 1-4. adimlarinin (Docker kurulumu, kullanici
# gruplari, depo, .env, ayaga kaldirma) koda dokulmus halidir. Rehber hala
# okunmaya deger - ne yapildigini anlatir - ama artik YAPAN o degil.
#
# Fark su: elle SSH adimlari her seferinde biraz farkli uygulanir ve
# "sunucuda ne oldugunu" kimse tam bilemez. cloud-init her instance'ta ayni
# sirayla, ayni sekilde calisir; sunucu artik onarilan degil, YENIDEN
# URETILEN bir sey.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - unzip
  - awscli

write_files:
  # Docker'in resmi deposu. Ubuntu'nun kendi docker.io paketi genelde eski ve
  # `docker compose` (v2 plugin) icermez.
  - path: /etc/apt/keyrings/.keep
    content: ""

  # Ayaga kaldirma betigi. runcmd icine gomulmedi ki SSH ile baglanip elle de
  # calistirilabilsin (guncelleme akisi icin).
  - path: /usr/local/bin/pulsecity-up
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      APP_DIR=/opt/${project_name}
      cd "$APP_DIR"

      # --- SOPS ile depodaki sirlari coz (Faz 15) ---
      #
      # age ozel anahtari SSM'de. Bos ise (age_private_key degiskeni
      # verilmemisse) bu adim atlanir ve sistem Slack bildirimi olmadan
      # calisir - sir yonetimi opsiyonel bir katman, kritik yol degil.
      AGE_KEY="$(aws ssm get-parameter \
        --name '${age_ssm_path}' \
        --with-decryption \
        --region '${aws_region}' \
        --query 'Parameter.Value' \
        --output text 2>/dev/null || true)"

      if [ -n "$AGE_KEY" ] && [ "$AGE_KEY" != "None" ]; then
        mkdir -p /root/.config/sops/age "$APP_DIR/secrets/decrypted"
        umask 077
        printf '%s\n' "$AGE_KEY" > /root/.config/sops/age/keys.txt

        for enc in "$APP_DIR"/secrets/*.enc; do
          [ -e "$enc" ] || continue
          out="$APP_DIR/secrets/decrypted/$(basename "$enc" .enc)"
          if SOPS_AGE_KEY_FILE=/root/.config/sops/age/keys.txt \
             sops --decrypt "$enc" > "$out" 2>/dev/null; then
            echo "coz: $(basename "$enc") -> $(basename "$out")"
          else
            echo "UYARI: cozulemedi: $enc" >&2
            rm -f "$out"
          fi
        done
        chmod 600 "$APP_DIR"/secrets/decrypted/* 2>/dev/null || true
      else
        echo "age anahtari yok - SOPS adimi atlandi"
      fi

      # Grafana parolasi SSM'den, instance'in KENDI IAM rolüyle okunuyor.
      # Deposunda ya da user-data'da duz metin olarak durmuyor.
      GRAFANA_PASSWORD="$(aws ssm get-parameter \
        --name '${grafana_ssm_path}' \
        --with-decryption \
        --region '${aws_region}' \
        --query 'Parameter.Value' \
        --output text)"

      PUBLIC_IP="$(curl -s -H "X-aws-ec2-metadata-token: $(
        curl -s -X PUT http://169.254.169.254/latest/api/token \
          -H 'X-aws-ec2-metadata-token-ttl-seconds: 60'
      )" http://169.254.169.254/latest/meta-data/public-ipv4)"

      # --- DuckDNS A kaydini bu sunucuya yonlendir (Faz 16) ---
      #
      # Token SOPS ile cozulmus dosyadan geliyor. Elastic IP sabit oldugu icin
      # bu aslinda tek seferlik, ama her acilista kosmasi zararsiz ve EIP
      # kullanilmayan bir kurulumda gerekli hale gelir.
      DUCK_TOKEN_FILE="$APP_DIR/secrets/decrypted/duckdns_token"
      if [ -n "${domain}" ] && [ -f "$DUCK_TOKEN_FILE" ]; then
        DUCK_SUB="$(echo '${domain}' | cut -d. -f1)"
        DUCK_TOKEN="$(tr -d '[:space:]' < "$DUCK_TOKEN_FILE")"
        RESP="$(curl -s "https://www.duckdns.org/update?domains=$DUCK_SUB&token=$DUCK_TOKEN&ip=$PUBLIC_IP" || true)"
        echo "duckdns guncelleme: $RESP"
      fi

      # --- .env ---
      #
      # Calisma zamaninda uretiliyor, depoda tutulmuyor.
      #
      # domain verildiyse dis adres HTTPS: Grafana'nin root_url'i de https
      # olmali, aksi halde Grafana kendi uygulama ici baglantilarini http
      # olarak uretir ve tarayici karma icerik uyarisi verir.
      #
      # GRAFANA_COOKIE_SECURE de ayni kosula bagli: "secure" cerez yalnizca
      # HTTPS uzerinden gonderilir. TLS'siz (IP ile servis edilen) bir
      # kurulumda true yapmak, tarayicinin oturum cerezini hic gondermemesi
      # yani girisin sessizce calismamasi demektir.
      if [ -n "${domain}" ]; then
        EXTERNAL_URL="https://${domain}"
        COOKIE_SECURE="true"
      else
        EXTERNAL_URL="http://$PUBLIC_IP"
        COOKIE_SECURE="false"
      fi

      umask 077
      cat > "$APP_DIR/.env" <<ENVFILE
      GRAFANA_ADMIN_USER=admin
      GRAFANA_ADMIN_PASSWORD=$GRAFANA_PASSWORD
      GRAFANA_ROOT_URL=$EXTERNAL_URL/grafana/
      GRAFANA_COOKIE_SECURE=$COOKIE_SECURE
      PULSECITY_DOMAIN=${domain}
      ACME_EMAIL=${acme_email}
      TARGET_RATE_PER_SEC=${target_rate_per_sec}
      VEHICLE_COUNT=${vehicle_count}
      ENVFILE

      docker compose \
        -f docker-compose.yml \
        -f deploy/docker-compose.prod.yml \
        up -d --build

runcmd:
  # --- Docker (resmi depo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # --- sops (Faz 15: depodaki sirlari cozmek icin) ---
  - curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
  - chmod +x /usr/local/bin/sops
  - usermod -aG docker ubuntu
  - systemctl enable --now docker

  # --- Depo ---
  - git clone --branch ${repo_branch} --depth 1 ${repo_url} /opt/${project_name}
  - chown -R ubuntu:ubuntu /opt/${project_name}

  # --- Ayaga kaldir ---
  - /usr/local/bin/pulsecity-up

  # --- Yeniden baslatmada otomatik ayaga kalksin ---
  # compose'daki `restart: unless-stopped` konteynerleri geri getirir, ancak
  # .env icindeki public IP degismis olabilir (EIP varsa degismez, yoksa
  # degisir). Bu unit .env'i her acilista yeniden uretir.
  - |
    cat > /etc/systemd/system/pulsecity.service <<'UNIT'
    [Unit]
    Description=PulseCity stack
    Requires=docker.service
    After=docker.service network-online.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/usr/local/bin/pulsecity-up

    [Install]
    WantedBy=multi-user.target
    UNIT
  - systemctl daemon-reload
  - systemctl enable pulsecity.service

final_message: "PulseCity hazir. Harita: http://$PUBLIC_IPV4/  Grafana: http://$PUBLIC_IPV4/grafana/"
