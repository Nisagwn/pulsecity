# PulseCity — Nginx reverse proxy (Faz 6)
#
# Grafana dashboard'unu (canlı demo / recruiter'ların izleyebileceği) tek bir
# public port (80) üzerinden dışa açar. Prometheus ve diğer servisler bilerek
# dışarı açılmıyor - sadece dashboard public.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana live/websocket bağlantıları için
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
