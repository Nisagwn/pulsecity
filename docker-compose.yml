services:
  # --- Kafka (KRaft mode, Zookeeper'sız tek broker - local gelistirme icin yeterli) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pulsecity-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # KRaft, cluster id olarak base64 kodlanmis 16 baytlik bir UUID bekler
      # (22 karakter). Duz metin bir isim ("pulsecity-cluster-01") broker'i
      # baslangicta hata verdirir.
      CLUSTER_ID: "LNB2LvLaGdpmMN_DZcRCDg"
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pulsecity-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle-pings --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle-pings-dlq --partitions 3 --replication-factor 1
      echo 'Topicler olusturuldu.'
      "

  # --- ScyllaDB (tek node - local gelistirme icin, Faz 6'da cluster'a cikarilabilir) ---
  scylla:
    image: scylladb/scylla:5.4
    container_name: pulsecity-scylla
    ports:
      - "9042:9042"
    command: --smp 2 --memory 1500M --overprovisioned 1 --api-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  scylla-init:
    image: scylladb/scylla:5.4
    container_name: pulsecity-scylla-init
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./scylla-init:/scylla-init
    entrypoint: ["/bin/sh", "-c"]
    # DIKKAT: `sh -c` sadece ILK argumani script olarak calistirir, geri kalanlar
    # $0/$1... olur. Bu yuzden komutun tamami TEK bir liste elemani olmali -
    # duz string yazilirsa compose kelimelere boler ve container'da yalnizca
    # `cqlsh` calisir (host argumani kaybolur, 127.0.0.1'e baglanmayi dener).
    command:
      - "cqlsh scylla -f /scylla-init/schema.cql"

  # --- Go Producer (Load Generator) ---
  producer:
    build:
      context: ./producer
    container_name: pulsecity-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "2112:2112"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      # Local laptop icin hafifletilmis profil.
      # Faz 3 benchmark'i icin orijinal degerlere don: 50000 / 20000 / 8
      TARGET_RATE_PER_SEC: "5000"
      VEHICLE_COUNT: "2000"
      PRODUCER_WORKERS: "4"
      METRICS_ADDR: ":2112"
      # Faz 8: periyodik olarak bir bolgeyi yapay olarak tikar, boylece
      # anomali tespitinin calistigi haritada/Grafana'da canli gorulebilir.
      # Bolgesel hiz verisini bilerek bozdugu icin prod'da ve benchmark
      # olcumlerinde KAPALI olmali (bkz. deploy/docker-compose.prod.yml).
      TEST_ANOMALY_DEMO: "true"

  # --- Go Consumer ---
  # Birden fazla instance ile paralel tuketim icin:
  #   docker compose up -d --scale consumer=3
  consumer:
    build:
      context: ./consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      scylla-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      KAFKA_DLQ_TOPIC: "vehicle-pings-dlq"
      KAFKA_GROUP_ID: "pulsecity-consumers"
      SCYLLA_HOSTS: "scylla:9042"
      CONSUMER_BATCH_SIZE: "2000"
      METRICS_ADDR: ":2113"

  # --- Faz 9: Canli harita (WebSocket + Leaflet) ---
  # Kendi consumer group'unda calisir (pulsecity-webviz): ana consumer'in
  # offset'lerine dokunmaz, ondan mesaj calmaz. Zero-loss yolu etkilenmez.
  webviz:
    build:
      context: ./webviz
    container_name: pulsecity-webviz
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      KAFKA_GROUP_ID: "pulsecity-webviz"
      PROM_URL: "http://prometheus:9090"
      LISTEN_ADDR: ":8080"
      BROADCAST_INTERVAL_MS: "1000"
      MAX_VEHICLES_ON_MAP: "1500"
      # Zaman yolculugu: gecmis kareler ScyllaDB'den okunur.
      # depends_on BILEREK eklenmedi - baglanti arka planda kuruluyor, Scylla
      # gec acilsa ya da dusse bile canli harita calismaya devam etmeli.
      SCYLLA_HOSTS: "scylla:9042"
      HISTORY_WINDOW_MS: "2000"
      HISTORY_MAX_AGE_SECONDS: "1800"
      HISTORY_ROWS_PER_ZONE: "2000"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pulsecity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - producer
      - consumer

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pulsecity-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pulsecity
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
