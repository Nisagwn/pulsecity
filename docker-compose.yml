services:
  # --- Kafka (KRaft mode, Zookeeper'sız tek broker - local gelistirme icin yeterli) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pulsecity-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # KRaft, cluster id olarak base64 kodlanmis 16 baytlik bir UUID bekler
      # (22 karakter). Duz metin bir isim ("pulsecity-cluster-01") broker'i
      # baslangicta hata verdirir.
      CLUSTER_ID: "LNB2LvLaGdpmMN_DZcRCDg"
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      # KRaft metadata + log segmentleri. Volume OLMADAN bu veri container'in
      # yazilabilir katmaninda durur: `docker compose down`, bir recreate ya da
      # imaj guncellemesi topic'leri ve commit edilmis offset'leri sessizce
      # siler. Consumer group offset'i sifirlanmasi zero-loss zincirini kirar.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pulsecity-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Retention politikasi bilerek acik yaziliyor. Broker varsayilani 7 GUN ve
    # sinirsiz boyut: 50k msg/sn * ~200 bayt = ~10 MB/sn, yani saatte ~36 GB.
    # Kalici volume eklendikten (Faz 12) sonra bu, diski dolduran bir kurulum
    # demek olurdu.
    #
    # retention.bytes PARTITION BASINA uygulanir: 512 MiB * 12 partition = ~6 GiB tavan.
    #
    # segment.bytes de kucultuldu (varsayilan 1 GiB): Kafka yalnizca KAPANMIS
    # segmentleri silebilir. 1 GiB'lik segmentlerle 512 MiB'lik bir retention
    # tavani asla devreye giremezdi - aktif segment hicbir zaman kapanmaz ve
    # politika sessizce etkisiz kalirdi.
    #
    # DLQ'nun retention'i UZUN (7 gun): orada duran mesajlar incelenmek icin
    # var, hacmi de dusuk. Ana topic ile ayni politikayi uygulamak, hata
    # ayiklanacak kaniti bir saat sonra silmek olurdu.
    # DIKKAT: buradaki komutlar TEK SATIR olmali. Ters bolu (\) ile satir
    # devami kullanilirsa compose bu blogu isleerken ters bolulari yutuyor ve
    # `--config ...` ayri bir komut olarak calistirilmaya calisiliyor
    # ("--config: command not found"). Topic yine olusur, ama retention
    # politikasi SESSIZCE uygulanmaz - bu yuzden asagida ayrica dogrulaniyor.
    #
    # Olusturma ve yapilandirma bilerek AYRI adimlar: `--create --if-not-exists`
    # zaten var olan bir topic'e --config uygulamaz. `--alter` ise her calisan
    # kurulumda politikayi yeniden dayatir, yani bu dosya mevcut bir kuruluma
    # da guvenle uygulanabilir.
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle-pings --partitions 12 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle-pings-dlq --partitions 3 --replication-factor 1
        kafka-configs --bootstrap-server kafka:9092 --entity-type topics --entity-name vehicle-pings --alter --add-config retention.ms=3600000,retention.bytes=536870912,segment.bytes=134217728
        kafka-configs --bootstrap-server kafka:9092 --entity-type topics --entity-name vehicle-pings-dlq --alter --add-config retention.ms=604800000
        echo 'Topicler olusturuldu, retention politikasi uygulandi:'
        kafka-configs --bootstrap-server kafka:9092 --entity-type topics --entity-name vehicle-pings --describe

  # --- ScyllaDB (tek node - local gelistirme icin, Faz 6'da cluster'a cikarilabilir) ---
  scylla:
    image: scylladb/scylla:5.4
    container_name: pulsecity-scylla
    ports:
      - "9042:9042"
    command: --smp 2 --memory 1500M --overprovisioned 1 --api-address 0.0.0.0
    volumes:
      # Ayni gerekce (bkz. kafka-data): volume olmadan yazilan her ping
      # container'in omruyle sinirli kalir ve Faz 11'in gecmise bakma ozelligi
      # her restart'ta bos veriyle baslar.
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  scylla-init:
    image: scylladb/scylla:5.4
    container_name: pulsecity-scylla-init
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./scylla-init:/scylla-init
    entrypoint: ["/bin/sh", "-c"]
    # DIKKAT: `sh -c` sadece ILK argumani script olarak calistirir, geri kalanlar
    # $0/$1... olur. Bu yuzden komutun tamami TEK bir liste elemani olmali -
    # duz string yazilirsa compose kelimelere boler ve container'da yalnizca
    # `cqlsh` calisir (host argumani kaybolur, 127.0.0.1'e baglanmayi dener).
    command:
      - "cqlsh scylla -f /scylla-init/schema.cql"

  # --- Go Producer (Load Generator) ---
  producer:
    build:
      context: ./producer
    container_name: pulsecity-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "2112:2112"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      # Local laptop icin hafifletilmis profil.
      # Faz 3 benchmark'i icin orijinal degerlere don: 50000 / 20000 / 8
      TARGET_RATE_PER_SEC: "5000"
      VEHICLE_COUNT: "2000"
      PRODUCER_WORKERS: "4"
      METRICS_ADDR: ":2112"
      # Faz 8: periyodik olarak bir bolgeyi yapay olarak tikar, boylece
      # anomali tespitinin calistigi haritada/Grafana'da canli gorulebilir.
      # Bolgesel hiz verisini bilerek bozdugu icin prod'da ve benchmark
      # olcumlerinde KAPALI olmali (bkz. deploy/docker-compose.prod.yml).
      TEST_ANOMALY_DEMO: "true"
    stop_grace_period: 15s
    healthcheck:
      # /readyz Kafka'ya son basarili yazmanin uzerinden ne kadar gectigine
      # bakar: process ayakta ama broker'a yazamiyorsa restart policy devreye
      # girer. Salt process kontrolu bu durumu goremezdi.
      test: ["CMD", "wget", "-qO-", "http://localhost:2112/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Go Consumer ---
  # Birden fazla instance ile paralel tuketim icin:
  #   docker compose up -d --scale consumer=3
  consumer:
    build:
      context: ./consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      scylla-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      KAFKA_DLQ_TOPIC: "vehicle-pings-dlq"
      KAFKA_GROUP_ID: "pulsecity-consumers"
      SCYLLA_HOSTS: "scylla:9042"
      CONSUMER_BATCH_SIZE: "2000"
      METRICS_ADDR: ":2113"
    # Docker'in varsayilan 10sn'lik SIGTERM->SIGKILL araligi, consumer'in son
    # batch'i ScyllaDB'ye yazip offset'i commit etmesi icin (8sn butce) fazla
    # dar. Sure yetmezse SIGKILL gelir ve batch commit edilmeden kalir - veri
    # kaybi degil ama gereksiz bir reprocessing turu.
    stop_grace_period: 20s
    healthcheck:
      # /readyz ScyllaDB session'ina gercek bir sorgu atar. connectWithRetry
      # yalnizca ACILISTA calisiyor; baglanti calisma sirasinda koparsa consumer
      # cokmeden her batch'i DLQ'ya yazmaya devam ederdi ve Docker bunu fark
      # etmezdi. Asil bu senaryoyu yakalamak icin var.
      test: ["CMD", "wget", "-qO-", "http://localhost:2113/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # --- Faz 9: Canli harita (WebSocket + Leaflet) ---
  # Kendi consumer group'unda calisir (pulsecity-webviz): ana consumer'in
  # offset'lerine dokunmaz, ondan mesaj calmaz. Zero-loss yolu etkilenmez.
  webviz:
    build:
      context: ./webviz
    container_name: pulsecity-webviz
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      KAFKA_GROUP_ID: "pulsecity-webviz"
      PROM_URL: "http://prometheus:9090"
      LISTEN_ADDR: ":8080"
      BROADCAST_INTERVAL_MS: "1000"
      MAX_VEHICLES_ON_MAP: "1500"
      # Zaman yolculugu: gecmis kareler ScyllaDB'den okunur.
      # depends_on BILEREK eklenmedi - baglanti arka planda kuruluyor, Scylla
      # gec acilsa ya da dusse bile canli harita calismaya devam etmeli.
      SCYLLA_HOSTS: "scylla:9042"
      HISTORY_WINDOW_MS: "2000"
      HISTORY_MAX_AGE_SECONDS: "1800"
      HISTORY_ROWS_PER_ZONE: "2000"
      # --- Koruma katmani (webviz/limits.go) ---
      #
      # Varsayilanlar kodun icinde de ayni; burada gorunur olmalari icin
      # yaziliyorlar - halka acik bir kurulumda ilk ayarlanacak yer burasi.
      #
      #   API_RATE_PER_SEC / API_BURST  IP basina /api/* hiz siniri. Haritanin
      #                                 kendi kullanimi en fazla 5 istek/sn
      #                                 uretir (kaydirici 200ms'ye kisitli),
      #                                 yani mesru kullaniciya iki kat pay var.
      #   HISTORY_MAX_IN_FLIGHT         Es zamanli gecmis sorgusu tavani. Her
      #                                 sorgu 9 bolgeye indigi icin 8 -> en
      #                                 fazla 72 acik ScyllaDB sorgusu.
      #   MAX_WS_CLIENTS                Es zamanli WebSocket istemcisi tavani.
      #   ALLOWED_ORIGINS               Bos = yalnizca ayni kaynak. Haritayi
      #                                 baska bir alan adindan gomeceksen o
      #                                 host'u virgulle ekle.
      MAX_WS_CLIENTS: "200"
      API_RATE_PER_SEC: "10"
      API_BURST: "30"
      HISTORY_MAX_IN_FLIGHT: "8"
      ALLOWED_ORIGINS: ""
    stop_grace_period: 15s
    healthcheck:
      # Scylla'ya BAKMAZ: gecmis okuma kritik yol degil, Scylla dusse bile
      # canli harita saglikli sayilmali (bkz. yukaridaki depends_on notu).
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Faz 13: Kafka consumer lag exporter ---
  # Lag Kafka'nin kendi metrigi; uygulama kodundan expose edilemez. Onceden
  # yalnizca benchmark.sh icinde CLI ile okunuyordu, yani uzerine alarm
  # kurulamiyordu.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: pulsecity-kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pulsecity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - producer
      - consumer

  # --- Faz 13: Alertmanager ---
  # Prometheus alarmi yalnizca HESAPLAR; gruplama, susturma ve bildirim
  # kararlari bu serviste.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pulsecity-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  # --- Faz 18: blue-green icin yesil kopya ---
  #
  # Normalde CALISMAZ - `bluegreen` profili arkasinda duruyor. Yalnizca
  # ./scripts/deploy-webviz.sh calistiginda ayaga kalkar.
  #
  # Neden sadece webviz: consumer zaten `--scale consumer=3` ile yatay ve
  # Kafka consumer group'u rebalance'i kendisi yonetiyor; kesintisiz deploy'a
  # gercekten ihtiyac duyan tek katman kullaniciya bakan taraf. Stateful
  # bilesenler (Kafka, ScyllaDB) blue-green'e HIC girmiyor - iki kopya ayni
  # veriyi paylasamaz.
  webviz-green:
    profiles: ["bluegreen"]
    build:
      context: ./webviz
    container_name: pulsecity-webviz-green
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "vehicle-pings"
      # AYRI consumer group: yesil kopya mavi kopyadan mesaj CALMAMALI.
      # Ayni group'u paylassalardi Kafka partition'lari ikiye boler ve her
      # iki harita da akisin yalnizca yarisini gorurdu.
      KAFKA_GROUP_ID: "pulsecity-webviz-green"
      PROM_URL: "http://prometheus:9090"
      LISTEN_ADDR: ":8080"
      BROADCAST_INTERVAL_MS: "1000"
      MAX_VEHICLES_ON_MAP: "1500"
      SCYLLA_HOSTS: "scylla:9042"
      HISTORY_WINDOW_MS: "2000"
      HISTORY_MAX_AGE_SECONDS: "1800"
      HISTORY_ROWS_PER_ZONE: "2000"
      # Koruma katmani mavi kopyayla AYNI olmali: gecis aninda trafigi tasiyan
      # yesil kopyadir, farkli limitlerle calismasi deploy sirasinda davranis
      # degistirir. Gerekceler icin yukaridaki webviz blogu.
      MAX_WS_CLIENTS: "200"
      API_RATE_PER_SEC: "10"
      API_BURST: "30"
      HISTORY_MAX_IN_FLIGHT: "8"
      ALLOWED_ORIGINS: ""
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  # --- Faz 17: log toplama ---
  #
  # Metrikler "ne kadar", loglar "neden" sorusunu yanitlar. Faz 13'te uc Go
  # servisi JSON log'a gecmisti; bu adim o hazirligin karsiligi.
  loki:
    image: grafana/loki:3.1.1
    container_name: pulsecity-loki
    ports:
      # Yerelde dogrudan sorgulanabilsin (Prometheus/Alertmanager gibi).
      # Prod override bunu kapatir; erisim Grafana uzerinden olur.
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  promtail:
    image: grafana/promtail:3.1.1
    container_name: pulsecity-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker API uzerinden konteyner kesfi icin. SALT OKUNUR - Promtail'in
      # yazma yetkisine ihtiyaci yok (bkz. promtail-config.yml'daki not).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pulsecity-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pulsecity
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  kafka-data:
  scylla-data:
  loki-data:
  promtail-positions:
